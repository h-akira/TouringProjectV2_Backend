AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TouringProjectV2 backend - accept asks, process them through the agent, return answers, and keep rides, memos, point memos and unreached asks, reading them back for taking over.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  # No defaults: each environment names its own parameters in samconfig.toml, so that a new environment cannot
  # silently use another's (Backend #7).
  AgentRuntimeArn:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of the SSM parameter (Tokyo) holding the agent runtime ARN, /trv2/<env>/agent-runtime-arn; written by the Agent deploy.
  AgentRegion:
    Type: String
    Default: us-east-1
  ConversationResetParameter:
    Type: String
    Description: Name of the SSM parameter (Tokyo) holding the conversation reset minutes, /trv2/<env>/conversation-reset-minutes.
  DailyQuota:
    Type: Number
    Default: 3000
    Description: Requests per key per day. One question is one POST plus up to about 70 polls.
  ThrottleRate:
    Type: Number
    Default: 5
  ThrottleBurst:
    Type: Number
    Default: 10

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref RecordsTable
        AUDIO_BUCKET: !Ref AudioBucket

Resources:
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub apigw-trv2-${Environment}-main
      StageName: Prod
      Auth:
        ApiKeyRequired: true

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-health
      Handler: handlers.health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /health
            Method: get
            Auth:
              ApiKeyRequired: false

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-ask
      Handler: handlers.ask.handler
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          QUEUE_URL: !Ref AskQueue
          CONVERSATION_RESET_PARAMETER: !Ref ConversationResetParameter
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AskQueue.QueueName
        - Statement:
            # The conversation's first time (a conditional put, then a read), the ask, and its removal when it
            # cannot be queued (R4-12: only what the code uses, and no Scan).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt RecordsTable.Arn
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub ${AudioBucket.Arn}/audio/*
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ConversationResetParameter}
      Events:
        Ask:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /asks
            Method: post

  ResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-result
      Handler: handlers.result.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt RecordsTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${AudioBucket.Arn}/answers/*
      Events:
        Result:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /asks/{askId}
            Method: get

  RidesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-rides
      Handler: handlers.rides.handler
      Environment:
        Variables:
          GEO_REGION: !Ref AWS::Region
      Policies:
        - Statement:
            # Writes check deletion marks in a transaction (Put and ConditionCheck); deleting a ride reads and
            # removes its records in batches (slice 3 spec §6). Only what the code uses, and no Scan (R4-12).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt RecordsTable.Arn
            - Effect: Allow
              Action: geo-places:ReverseGeocode
              Resource: "*"
      Events:
        Ride:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /rides/{rideId}
            Method: put
        Route:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /rides/{rideId}/route/{seq}
            Method: put
        RideDelete:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /rides/{rideId}
            Method: delete
        Note:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /rides/{rideId}/notes/{noteId}
            Method: put
        NoteDelete:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /rides/{rideId}/notes/{noteId}
            Method: delete

  AskEditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-ask-edit
      Handler: handlers.ask_edit.handler
      Environment:
        Variables:
          GEO_REGION: !Ref AWS::Region
      Policies:
        - Statement:
            # The memo and the unreached ask are transactions (Update and ConditionCheck); deleting an ask reads it,
            # marks it (a conditional put) and removes it. Only what the code uses, and no Scan (R4-12).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
                - dynamodb:BatchGetItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt RecordsTable.Arn
            # An unreached ask gets its place on the first PUT, like a point memo (slice 4 spec §4.4).
            - Effect: Allow
              Action: geo-places:ReverseGeocode
              Resource: "*"
      Events:
        Memo:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /asks/{askId}/memo
            Method: put
        AskDelete:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /asks/{askId}
            Method: delete
        Offline:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /asks/{askId}/offline
            Method: put

  RecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-records
      Handler: handlers.records.handler
      # A page is one query of up to 1 MB, turned into JSON.
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt RecordsTable.Arn
      Events:
        Records:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /records
            Method: get

  TranscriptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-transcriptions
      Handler: handlers.transcriptions.handler
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          QUEUE_URL: !Ref AskQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AskQueue.QueueName
        - Statement:
            # The transcription, its polling, and its removal when it cannot be queued (R4-12).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt RecordsTable.Arn
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub ${AudioBucket.Arn}/audio/*
      Events:
        Accept:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /transcriptions
            Method: post
        Result:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /transcriptions/{transcriptionId}
            Method: get

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lambda-trv2-${Environment}-worker
      Handler: handlers.worker.handler
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          AGENT_ARN: !Ref AgentRuntimeArn
          AGENT_REGION: !Ref AgentRegion
          GEO_REGION: !Ref AWS::Region
          POLLY_VOICE_ID: Kazuha
      Policies:
        - Statement:
            # Claiming, writing the result and failing a stalled claim are all UpdateItem (R4-12): the claim and the
            # stalled-claim recovery are conditional, the result writes are not.
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RecordsTable.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub ${AudioBucket.Arn}/audio/*
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${AudioBucket.Arn}/answers/*
            - Effect: Allow
              Action: transcribe:StartStreamTranscription
              Resource: "*"
            - Effect: Allow
              Action: geo-places:ReverseGeocode
              Resource: "*"
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub ${AgentRuntimeArn}/*
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt AskQueue.Arn
            BatchSize: 1

  AskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sqs-trv2-${Environment}-ask
      VisibilityTimeout: 180
      MessageRetentionPeriod: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AskDeadLetterQueue.Arn
        maxReceiveCount: 2

  AskDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sqs-trv2-${Environment}-ask-dlq
      MessageRetentionPeriod: 1209600

  RecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub dynamodb-trv2-${Environment}-records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Transcriptions (needed while the app polls, slice 3 spec §6.1) and conversations (55 minutes at most, Backend #2)
      # carry expiresAt.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub s3-trv2-${Environment}-audio-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAudioAfterOneDay
            Status: Enabled
            ExpirationInDays: 1

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: RestApiProdStage
    Properties:
      UsagePlanName: !Sub usageplan-trv2-${Environment}-main
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: Prod
      Quota:
        Limit: !Ref DailyQuota
        Period: DAY
      Throttle:
        RateLimit: !Ref ThrottleRate
        BurstLimit: !Ref ThrottleBurst

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: RestApiProdStage
    Properties:
      Name: !Sub apikey-trv2-${Environment}-main
      Description: The shared connection key typed into the App. Read its value with the command in README.md.
      Enabled: true

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  ApiUrl:
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  ApiKeyId:
    Value: !Ref ApiKey
